name: images
# Generates images with Cloudflare Workers AI (free tier) from a prompts JSON.
on:
  workflow_dispatch:
    inputs:
      job: { description: "Path to prompts JSON", required: true }
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: 1c79efc3ad22109588d34576fe6d1035
        run: python3 scripts/cf_images.py "${{ inputs.job }}"
      - uses: actions/upload-artifact@v4
        with: { name: images, path: images/, retention-days: 3 }
